<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор об'ємної ваги Нова Пошта</title>
    <style>
        .np-calc-card {
            max-width: 480px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            font-family: system-ui, -apple-system, sans-serif;
            background: #ffffff;
            border: 1px solid #e5e7eb;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .input-group label {
            font-size: 13px;
            color: #4b5563;
            font-weight: 600;
        }
        .input-group input {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }
        .result-box {
            background: #f9fafb;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            border-left: 4px solid #eb3223;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .result-row.highlight {
            font-size: 16px;
            font-weight: 700;
            color: #eb3223;
            border-top: 1px solid #e5e7eb;
            padding-top: 8px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="np-calc-card">
    <h3 style="margin-top: 0; color: #111827;">Розрахунок ваги посилки (Нова Пошта)</h3>
    
    <div class="calc-grid">
        <div class="input-group">
            <label>Довжина (см)</label>
            <input type="number" id="length" value="85" oninput="calculateNP()">
        </div>
        <div class="input-group">
            <label>Ширина (см)</label>
            <input type="number" id="width" value="55" oninput="calculateNP()">
        </div>
        <div class="input-group">
            <label>Висота (см)</label>
            <input type="number" id="height" value="50" oninput="calculateNP()">
        </div>
        <div class="input-group">
            <label>Фактична вага (кг)</label>
            <input type="number" id="actualWeight" step="0.1" value="28" oninput="calculateNP()">
        </div>
    </div>

    <div class="result-box">
        <div class="result-row">
            <span>Об'єм посилки:</span>
            <span id="volumeM3">0.234 м³</span>
        </div>
        <div class="result-row">
            <span>Об'ємна вага:</span>
            <span id="volumetricWeight">58.44 кг</span>
        </div>
        <div class="result-row">
            <span>Фактична вага:</span>
            <span id="actualDisplay">28.00 кг</span>
        </div>
        <div class="result-row highlight">
            <span>Розрахункова вага:</span>
            <span id="chargeableWeight">58.44 кг</span>
        </div>
    </div>
</div>

<script>
function calculateNP() {
    const l = parseFloat(document.getElementById('length').value) || 0;
    const w = parseFloat(document.getElementById('width').value) || 0;
    const h = parseFloat(document.getElementById('height').value) || 0;
    const actual = parseFloat(document.getElementById('actualWeight').value) || 0;

    const volumeM3 = (l * w * h) / 1000000;
    const volumetric = (l * w * h) / 4000;
    const chargeable = Math.max(actual, volumetric);

    document.getElementById('volumeM3').innerText = volumeM3.toFixed(3) + ' м³';
    document.getElementById('volumetricWeight').innerText = volumetric.toFixed(2) + ' кг';
    document.getElementById('actualDisplay').innerText = actual.toFixed(2) + ' кг';
    document.getElementById('chargeableWeight').innerText = chargeable.toFixed(2) + ' кг';
}
calculateNP();
</script>

</body>
</html>
